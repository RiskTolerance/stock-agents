services:
  db:
    image: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql/data
  monitor:
    image: monitor
    build:
      context: ./monitor
      dockerfile: Dockerfile
    restart: always
    ports:
      - 3000:3000
volumes:
  pgdata:
